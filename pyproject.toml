[project]
name = "jobhunt"
version = "0.1.0"
description = "Personal job-search system: discovery, scoring, and human-in-the-loop tailoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "langchain-anthropic>=0.3",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "playwright>=1.47",     # auto-apply (beta): drives a real browser through Workday forms
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",  # required by FastAPI for form POSTs
    "pyyaml>=6.0",              # config.yaml / facts.yaml
    "rapidfuzz>=3.9",           # SPEC 6.3 dedupe title similarity
    "torch>=2.3",                # local embeddings (with transformers); see src/jobhunt/embeddings.py
    "transformers>=4.44",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.scripts]
jobhunt = "jobhunt.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "E722"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # resume/cover-letter fixtures are long literal lines
