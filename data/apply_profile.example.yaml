# TEMPLATE for data/apply_profile.yaml (git-ignored). You don't need to copy it: on first use jobhunt creates
# data/apply_profile.yaml from the contact: block of data/facts.yaml, and Settings -> Auto-apply edits it.
# Every value below is a PLACEHOLDER.
#
# Answers jobhunt types into application forms on your behalf. Nothing here leaves your machine except into
# the form you are applying on. Passwords are NOT stored here (Settings -> Auto-apply keeps them encrypted).
#
# 'questions:' entries win over the built-in matching, so add one whenever a site words something oddly:
#   - match: "how did you hear"          # substring of the label, or /a regex/
#     answer: "Company website"
# Leave an EEO answer as "I do not wish to answer" if you would rather not say.

