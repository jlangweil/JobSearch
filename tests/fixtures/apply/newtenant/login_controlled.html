<!doctype html>
<!-- A sign-in page that behaves like Workday's: the inputs are controlled components whose state only updates on
     real key events, and the Sign In button stays disabled until that state is filled. Setting `value` from
     script (what Playwright's fill() does) leaves the form's own state empty, so the button never enables and a
     click does nothing at all — no navigation, no error. This is what a real tenant did to the first beta. -->
<html lang="en">
<head><meta charset="utf-8"><title>Sign In</title></head>
<body>
<h2 data-automation-id="pageHeader">Sign In</h2>
<label for="em">Email Address</label><input id="em" data-automation-id="email" type="email" autocomplete="off">
<label for="pw">Password</label><input id="pw" data-automation-id="password" type="password" autocomplete="off">
<button id="btn" data-automation-id="signInSubmitButton" disabled onclick="signIn()">Sign In</button>
<a data-automation-id="createAccountLink" href="create.html">Create Account</a>
<div data-automation-id="errorMessage" id="err" hidden>We could not find an account with that email address.</div>
<script>
  // the component's state, deliberately NOT read back from input.value
  var state = {email: '', password: ''};
  function bind(id, key) {
    var el = document.getElementById(id);
    ['keyup', 'keydown'].forEach(function (evt) {
      el.addEventListener(evt, function (e) { state[key] = e.target.value; sync(); });
    });
  }
  function sync() {
    document.getElementById('btn').disabled = !(state.email.indexOf('@') > 0 && state.password.length >= 8);
  }
  function signIn() { document.getElementById('err').hidden = false; }
  bind('em', 'email');
  bind('pw', 'password');
</script>
</body>
</html>
