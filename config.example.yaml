# jobhunt configuration TEMPLATE. Committed to git; your own copy, config.yaml, is git-ignored.
# On first run jobhunt copies this file to config.yaml (or: copy config.example.yaml config.yaml). Edit config.yaml,
# directly or on the Settings page. No secrets here: API keys and passwords go in .env.
#
# >>> PLACEHOLDER VALUES <<<  Everything under profile / must_haves / nice_to_haves /
# dealbreakers / filters / companies is a worked example. Replace it with YOUR target role,
# comp floor, location rules and companies before trusting any score. See README.md.

profile:
  headline: "Senior project technical lead — enterprise integration architecture"   # PLACEHOLDER
  years_experience: 25                                                    # PLACEHOLDER
  summary_fact_ids: [summary-primary]
  locations:
    base: "Springfield, IL"                                               # PLACEHOLDER: your town
    accept: [remote, hybrid]      # add "onsite" to allow on-site roles inside the commute area
    max_commute_miles: 24   # informational only — no geocoding; see filters.local_location_patterns
  seniority_band: [lead, principal, staff, architect, manager]
  comp_floor: 150000                                                      # PLACEHOLDER: your minimum base pay
  employment_types: [fte]
  # What kind of role you want. Drives the `role_fit` subscore (SPEC §6.6 amendment).
  target_roles: [technical lead, delivery lead, project lead, solution lead, integration lead, engineering manager, delivery manager, technical program manager, development manager]
  role_preference: "Leadership roles: leading teams, owning delivery, and directing technical and architecture decisions, with limited hands-on coding. Roles that are mostly individual-contributor development should score low on role_fit."

must_haves:
  - "Integration or API platform ownership"
nice_to_haves:
  - "MuleSoft or equivalent iPaaS"
  - "AWS"
  - "Financial services or insurance domain"
dealbreakers:
  - "Requires active security clearance"
  - "Onsite 5 days outside commute radius"

# Scoring focus (Settings → Scoring focus). Applied in code to every score, and shown to the scoring model.
# boost: phrases that should rank a job higher (in the title counts most). avoid: title phrases for areas you
# don't want or have no experience in; those jobs' totals are capped at avoid_cap. PROPOSED lists: yours to edit.
focus:
  boost: ["mulesoft", "mule", "anypoint", "api", "api-led", "integration", "integrations", "ipaas", "migration", "modernization", "tech lead", "technical lead", "delivery lead", "delivery manager", "solution lead", "engineering manager"]
  avoid: ["cybersecurity", "cyber", "information security", "infosec", "security architect", "security engineer", "platform security", "application security", "security operations", "GRC", "penetration", "CISO", "SOC analyst"]
  avoid_cap: 45

filters:
  max_age_days: 30
  # What to do with a posting older than that window. "keep" leaves it in and lets scoring judge it: a board
  # can renew a listing without changing its posted date, and Workday reports anything over a month as the
  # single bucket "30+ Days Ago". "filter" restores the old behaviour of dropping it.
  stale_action: keep
  # Case-insensitive regexes. A title matching any blocklist entry is filtered out.
  title_blocklist: ['\b(intern|internship|junior|jr\.?|associate|sales|account executive|recruiter|designer|nurse|pharmacist|physician|therapist|underwriter|actuar\w*|claims|agent)\b']
  # The titles you target. No longer a filter (inexact word matches dropped roles like "Managing Engineer"):
  # its terms go to the scoring model, which reads each posting's title by meaning.
  title_allowlist: ['\b(architect|architecture|integration|api|platform|principal|staff|lead|manager|managing|head of|director|delivery|program)\b']
  # Matched against jobs.employment_type (fte|contract|c2h|unknown). "1099" from the SPEC example
  # never matches a derived type, so "contract" is used here.
  employment_blocklist: [contract, "1099"]
  # Case-insensitive regexes over the description. Deterministic dealbreakers.
  dealbreaker_patterns: ['active (ts/sci|top secret|secret) clearance', 'clearance (is )?required']
  # Addition to SPEC: hybrid/onsite/unknown-type jobs survive only if their location matches one of
  # these — a stand-in for the commute radius, since nothing is geocoded. PLACEHOLDER: replace with the towns
  # within your commute (one regex per line is easiest to read), and set local_states to their states.
  local_location_patterns:
    - 'Springfield|Chatham|Rochester|Sherman|Riverton|Auburn|Petersburg'
  # Each office in a multi-location posting is checked on its own, and a town only counts when the office names
  # one of these states (or no state at all) — so "Springfield, MA" doesn't pass for "Springfield, IL".
  local_states: [IL]
  # Remote roles restricted to another country are dropped unless the location also looks local/US.
  excluded_location_patterns: ['\b(India|United Kingdom|UK|Ireland|Canada|Mexico|Brazil|Poland|Philippines|Germany|Spain|Singapore|Japan|China|Australia|Costa Rica|Hungary|Slovakia|Czech)\b']
  staffing_agency_slugs: []
  # false: filtered-out and duplicate postings keep title/company/location/link/reason but not the full
  # description or embedding — the database stays small. true: keep everything.
  keep_filtered_descriptions: false

scoring:
  provider: "anthropic"   # anthropic (Claude, ≈ $0.01/job with prompt caching) | local (local_llm below, free)
  model: claude-haiku-4-5     # benchmarked 2026-09-30 against qwen3 8b/30b/32b and Sonnet 5.5: close to Sonnet, 40% the price
  rubric_version: v9          # v9: v8 + target titles read by meaning (the title allowlist no longer filters)
  # PROPOSED weights — yours to tune on /settings (recomputes totals without re-scoring).
  # role_fit = leadership/delivery vs hands-on; weighted equal to skill_match per your priorities.
  # The total: the role (integration / technical / delivery leads first), your qualifications, closeness to your
  # ideal job (ideal_job below), the employer's industry (insurance first: industry_scores below), seniority, and a
  # little for focus keywords (Scoring focus). Pay and location weigh nothing here (they are hard filters); ghost
  # signals are shown, not deducted.
  weights: {role_fit: 0.35, skill_match: 0.30, industry_fit: 0.15, seniority_fit: 0.10, focus_fit: 0.10, ideal_fit: 0, domain_fit: 0, comp_fit: 0, logistics_fit: 0}
  # Your ideal job: this role in facts.yaml with its accomplishments. ideal_fit = how close a posting is to it by
  # embedding similarity (`low` or below -> 0, `high` or above -> 100). Shown on each job but weighted 0: the small
  # embedding model reads mostly a posting's opening, often company boilerplate, so it misjudges e.g. PGIM's roles.
  ideal_job: {role: role-example-current, low: 0.60, high: 0.80}   # a role id from YOUR data/facts.yaml
  # industry_fit by the employer's `industry:` under companies. Companies not listed: "insurance"/"assurance" in the
  # name counts as insurance; otherwise `unknown`.
  industry_scores: {insurance: 100, insurtech: 95, financial: 75, health: 60, unknown: 50, other: 40}
  # Employers not under `companies:` (Adzuna, email alerts) or listed there without an industry. Add insurers here.
  industry_by_employer: {"JPMorgan Chase": financial, "Chubb": insurance, "Veeva Systems": tech, "Snowflake": tech, "Deloitte": services, "Johnson and Johnson": pharma, "J&J": pharma}
  ghost_penalty: 0          # ghost signals are shown, not deducted
  heatmap_min_score: 75     # Keyword heatmap (sidebar): what the jobs scoring at least this much ask for
  shortlist_threshold: 70
  max_per_run: 150
  concurrency: 5
  # The scoring prompt shows your most recent roles with their accomplishments (newest first), older roles as one
  # line each, plus your certifications and skills from data/facts.yaml.
  min_description_chars: 400      # shorter postings (alert-email snippets) wait for the full text
  recent_roles_in_detail: 2
  earlier_roles: full             # full: older roles with their accomplishments (their skills count) · titles: one line
  max_achievements_per_role: 20   # in facts.yaml order — put your strongest bullets first

tailoring:
  provider: "anthropic"   # keep anthropic: small local models often fail the fact/ATS validation for resumes
  # automated: draft straight away. ats_super_match: first tick which posting keywords and headline may be added,
  # then draft to ATS rules (up to three pages keeping major projects, tech stacks and big wins; posting keywords
  # throughout; strong verbs; acronyms spelled out). The job page lets
  # you pick per job; this is the default.
  generation_mode: automated
  model: claude-sonnet-5-5
  max_draft_attempts: 3
  # complete: keep every role and accomplishment from your fact bank, reordered and reworded for the posting.
  # focused: only the accomplishments that best match the posting (shorter). Settings → Resume tailoring.
  resume_mode: complete
  effort: medium                # Claude reasoning effort for drafting: low | medium | high
  # separate_lines: employer / job title / dates each on their own line in the .docx, so Workday and other resume
  # parsers fill your work history correctly. one_line: the compact "Title | Employer | dates" heading.
  role_layout: separate_lines
  max_bullets_per_role: 0       # 0 = no limit
  max_bullet_chars: 320
  # Resume sections, in order. ATS parsers recognize these standard headings (see SPEC §7.6).
  sections: [summary, skills, experience, projects, education, certifications]
  # The Projects section (kind: project facts), written by code into every tailored resume: projects whose tags (or
  # their accomplishments' tags) the posting mentions, best match first, with a Technologies: line (posting keywords
  # first). include: relevant | always | never. Remove `projects` from `sections` to leave the section out.
  projects:
    include: relevant
    max_projects: 3
    max_bullets_per_project: 2
  facts_per_requirement: 5
  fact_match_threshold: 0.6

# A model running on this machine (used when scoring.provider or tailoring.provider is `local`).
# Setup: install Ollama (https://ollama.com), then `ollama pull qwen3:8b`. Test it on Settings → Language models.
local_llm:
  api: "ollama"                          # ollama (native API) | openai (LM Studio, llama.cpp llama-server, vLLM)
  base_url: "http://127.0.0.1:11434"   # Ollama's default; LM Studio is usually http://127.0.0.1:1234
  model: "qwen3:8b"                    # qwen3:8b (5.2 GB, Q4) · qwen3:8b-q8_0 (8.9 GB) · qwen3:8b-fp16 (16 GB)
  num_ctx: 16384                       # context tokens; the scoring prompt plus a long posting is ~6-10k
  concurrency: 2                       # parallel scoring requests
  keep_alive: "30m"                    # keep the model loaded between jobs
  timeout_s: 300.0
  temperature: 0.0
  think: false                         # Qwen3 thinking mode: slower, not needed for scoring

# Job-alert emails: LinkedIn, Indeed and others mail you their listings; jobhunt reads that mailbox read-only and
# files what it finds. Set it up on Settings → Job alert emails (credentials go to .env, never config.yaml).
email:
  enabled: false
  host: "imap.gmail.com"
  port: 993
  folder: "INBOX"               # or a Gmail label / mail folder you filter alerts into, e.g. "JobAlerts"
  senders: []                   # [] = the built-in LinkedIn / Indeed / Glassdoor / ZipRecruiter alert addresses
  subject_patterns: []          # optional extra matching, e.g. ['job alert']
  max_age_days: 14
  max_messages: 200

embeddings:
  model: "BAAI/bge-small-en-v1.5"

schedule:
  # Schedules are created, enabled and paused on the Schedules page (stored in the database).
  # This is only the default time zone for new schedules.
  timezone: "America/New_York"

# Auto-apply (BETA). Fills Workday applications in a real browser using data/apply_profile.yaml and the
# sign-in saved on Settings -> Auto-apply (passwords are encrypted with Windows DPAPI, never stored here).
# auto_submit is the only switch that actually sends an application; with it off a run stops on the Review page.
auto_apply:
  enabled: false             # the beta: switch on in Settings -> Auto-apply
  ats_types: [workday]
  headless: false            # watch it work, and take over whenever you like
  auto_submit: false         # OFF: fill everything, then stop on Review for you to check and submit
  stop_on_unknown: true      # pause rather than leave a question it has no answer for blank
  create_accounts: true      # a Workday site you have not used before: sign up, then remember the account
  password_mode: "per_site"    # per_site: a generated password per tenant; shared: reuse the one you saved
  store_passwords: encrypted   # plain: site passwords are kept as typed and shown on the Auto-apply page,
                               # so a generated one can be read and used by hand. "encrypted" uses Windows
                               # DPAPI instead (a copied database then yields nothing).
  read_verification_email: true   # read the "verify your email" code from the mailbox set up for job alerts
  verification_wait_seconds: 180
  wait_for_human_seconds: 300
  keep_open_minutes: 30      # after a run stops or fails, the window stays open this long so you can see the
                             # state of the page (the run is already recorded; closing the window ends the wait)  # with a visible browser, pause this long for you to type a verification code
                               # (or anything else it cannot do) and then carry on by itself
  upload_cover_letter: true
  apply_mode: autofill       # autofill: let the site read the resume and then correct what it got wrong.
                             # manual: type every field in ourselves (exact, but slower and fussier).
  fill_work_experience: true # type each role into Workday's own fields; false = attach the resume and let their
                             # parser fill them (it splits roles and drops employers, so true is recommended)
  account_email: ""          # sign-in used when creating an account on a new tenant (blank = your profile email)
  timeout_seconds: 45
  slow_mo_ms: 0
  keep_screenshots: true
  max_work_experience: 6
  max_skills: 15             # skills offered to a "Type to Add Skills" picker, taken from your fact bank

web:
  host: "127.0.0.1"          # "0.0.0.0" opens it to your network (set WEB_PASSWORD in .env first)
  port: 8000
  executor_workers: 4

paths:
  db: "./data/jobhunt.db"
  checkpoints: "./data/checkpoints.db"
  facts: "./data/facts.yaml"
  output_root: "./output"
  exports: "./exports"
  resume_template: "./data/resume_template.docx"
  soffice: "C:/Program Files/LibreOffice/program/soffice.exe"   # null to skip PDF
  max_path_chars: 240
  lock_stale_minutes: 30

sources:
  # Workday and SuccessFactors are the priority sources. Both are query-driven: each board is searched
  # with these terms (a company entry may override with its own `queries`). Results from overlapping
  # queries are de-duplicated per board. After the first run, postings already in the database are
  # recorded as sightings without re-downloading their descriptions.
  workday:
    enabled: true
    rate_limit_per_sec: 2
    max_pages_per_query: 3        # 20 postings per page
    queries: ["integration architect", "enterprise architect", "solutions architect", "api", "integration", "technical lead"]
    # Source-side narrowing via each tenant's own facets (regexes over the facet value names). Searches only
    # return postings in matching job categories/families and countries. A tenant without such a facet, or
    # with no matching value, is left unfiltered on that dimension. A company may override with its own
    # `category_patterns` ([] = no category filter). See categories with: jobhunt companies probe-workday <url>
    category_patterns: ['technolog', 'information', '(?-i:\bIT\b)', '\bdata\b', 'digital', 'software', 'engineer', 'architect', 'cyber', 'security', 'cloud', 'infrastructure', 'integration', 'agile', 'analytics']
    country_patterns: ['united states', '\bUSA?\b']
  successfactors:
    enabled: true
    rate_limit_per_sec: 1
    max_pages_per_query: 2        # ~25 postings per page
    queries: ["architect", "integration", "api", "technical lead"]
  # Phenom and Eightfold career sites (added 2026-09-15). Query-driven like Workday; Phenom also narrows by the
  # site's own country facet. Many Phenom sites front a Workday tenant: add only ones not already listed as workday.
  phenom:
    enabled: true
    rate_limit_per_sec: 1
    max_pages_per_query: 3        # 50 postings per page
    queries: ["architect", "integration", "api", "technical lead", "delivery lead"]
    country_patterns: ['united states', '\bUSA?\b']
  eightfold:
    enabled: true
    rate_limit_per_sec: 1
    max_pages_per_query: 5        # 10 postings per page (API maximum)
    queries: ["architect", "integration", "api", "technical lead", "delivery"]
  greenhouse: {enabled: true, rate_limit_per_sec: 1}
  lever: {enabled: true, rate_limit_per_sec: 1}
  ashby: {enabled: true, rate_limit_per_sec: 1}
  # Adzuna job search API (Settings → Adzuna). Keys go in .env. The API returns 500-character snippets; before
  # scoring, the full posting is read from the job's adzuna.com/details page (robots.txt allows it; the API's /land/ad
  # links are disallowed and never fetched), and a job whose page says it's no longer available is closed.
  # Company-only runs skip Adzuna (it isn't a company board).
  adzuna:
    enabled: false           # needs ADZUNA_APP_ID / ADZUNA_APP_KEY in .env
    rate_limit_per_sec: 1
    fetch_full_description: true  # false: score on the snippet and paste full postings by hand
    queries: ["mulesoft", "integration architect", "technical lead", "delivery lead", "api platform"]
    location: "Springfield, IL"
    distance_miles: 22
    max_days_old: 30
    pages: 2                      # 50 results per page, per search term
    category: "it-jobs"           # "" = any category
    salary_min: 0
    exclude_words: []
    title_only: false             # true: search terms must appear in the job title

